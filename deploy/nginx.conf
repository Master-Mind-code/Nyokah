server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les photos de vehicule transitent en base64 dans le JSON (limite API : 8 Mo).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API : relayee vers le conteneur "api" du docker-compose.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentation Swagger de l'API (si ENABLE_SWAGGER=true).
    location /docs {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    # Fichiers generes par Vite : noms hashes, mise en cache longue.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
