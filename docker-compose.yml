# Pile complete Nyokah : PostgreSQL + API + frontend (nginx).
#   cp .env.production.example .env   puis adaptez les valeurs
#   docker compose up -d --build
# L'application est servie sur le port 80 ; seul nginx est expose.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyokah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: ${POSTGRES_DB:-nyokah}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      API_URL: ${PUBLIC_URL:?PUBLIC_URL est requis}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyokah}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nyokah}?schema=public
      CORS_ORIGINS: ${PUBLIC_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET est requis}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET est requis}
      PAYMENT_RETURN_URL: ${PUBLIC_URL}/paiement/retour
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@nyokah.ci}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Nyokah@2026}

  web:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  db-data:
